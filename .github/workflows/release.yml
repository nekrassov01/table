name: Release
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  tagpr:
    timeout-minutes: 30
    runs-on: ubuntu-slim
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - name: Run tagpr
        uses: Songmu/tagpr@v1.22.0
        id: run-tagpr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
