name: CI
on:
  push:
    branches:
      - main
    paths:
      - "**/*.go"
      - "**/go.mod"
      - "**/go.sum"
      - "**/testdata/*.txt"
      - "docs/EXAMPLES.md"
  pull_request:
    branches:
      - "*"
    paths:
      - "**/*.go"
      - "**/go.mod"
      - "**/go.sum"
      - "**/testdata/*.txt"
      - "docs/EXAMPLES.md"
  workflow_dispatch:

jobs:
  ci:
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    timeout-minutes: 30
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    steps:
      - name: Set git to use LF
        if: ${{ matrix.os == 'windows-latest' }}
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Run lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: latest
          args: --timeout=10m
          skip-cache: true

      - name: Run vulnerability check
        uses: golang/govulncheck-action@v1.1.0
        with:
          go-version-file: go.mod
          go-package: ./...
          cache: false

      - name: Run tests
        run: |
          go test -race -cover -v -coverprofile coverage.out -covermode atomic ./...

      - name: Run benchmark smoke tests
        working-directory: benchmarks
        run: |
          go test -run '^$' -bench . -benchtime 1x ./...
          go test -tags cold -run '^$' -bench 'Cold$' -benchtime 1x ./...

      - name: Vet skill commands
        run: |
          go vet ./.agents/skills/...

      - name: Upload coverage
        uses: actions/upload-artifact@v7.0.2
        with:
          path: coverage.out
          name: coverage-${{ matrix.os }}
          if-no-files-found: error

  coverage:
    timeout-minutes: 30
    runs-on: ubuntu-slim
    permissions:
      contents: read
      pull-requests: write
      actions: read
    needs:
      - ci

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Download coverage
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: coverage-*

      - name: Run octocov
        uses: k1LoW/octocov-action@v1.5.2
